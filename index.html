<script>
  // Apply saved / requested theme before first paint (no flash)
  try {
    var q = new URLSearchParams(location.search).get('theme');
    var t = q || localStorage.getItem('theme');
    if (t === 'mustard' || t === 'cobalt') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>

</body>
